<!DOCTYPE html>
<html lang="es">
<head>

    <!-- ================================================================
         CONFIGURACIÓN BÁSICA
         ================================================================ -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TecnoDoc Pro - Gestión técnica inteligente de proformas, informes y almacén."
    >

    <meta
        name="theme-color"
        content="#080c14"
    >

    <title>TecnoDoc Pro | Iniciar sesión</title>


    <!-- ================================================================
         CSS
         ================================================================ -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ================================================================
         CONTENEDOR PRINCIPAL DE LOGIN
         ================================================================ -->

    <main
        class="login-container"
        aria-labelledby="login-title"
    >

        <section
            class="glass-card"
            aria-label="Inicio de sesión de TecnoDoc Pro"
        >


            <!-- ========================================================
                 IDENTIDAD DE LA APLICACIÓN
                 ======================================================== -->

            <div class="logo-section">

                <!-- Logo / icono -->
                <div
                    class="app-logo"
                    aria-hidden="true"
                >

                    <svg
                        width="46"
                        height="46"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                        ></path>

                        <path
                            d="M9 12l2 2 4-4"
                        ></path>

                    </svg>

                </div>


                <h1 id="login-title">
                    TecnoDoc Pro
                </h1>

                <p>
                    Gestión técnica inteligente
                </p>

            </div>



            <!-- ========================================================
                 MENSAJES DEL SISTEMA
                 ======================================================== -->

            <!--
                JavaScript podrá utilizar este elemento para mostrar:

                - Credenciales incorrectas
                - Usuario no registrado
                - Error de conexión
                - Cuenta bloqueada
                - Sesión expirada
            -->

            <div
                id="loginMessage"
                class="alert"
                role="alert"
                aria-live="polite"
                hidden
            ></div>



            <!-- ========================================================
                 FORMULARIO
                 ======================================================== -->

            <form
                id="loginForm"
                novalidate
            >


                <!-- ====================================================
                     CORREO
                     ==================================================== -->

                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        inputmode="email"
                        placeholder="correo@empresa.com"
                        required
                        aria-required="true"
                    >

                </div>



                <!-- ====================================================
                     CONTRASEÑA
                     ==================================================== -->

                <div class="input-group">

                    <div
                        class="password-label"
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            gap:10px;
                        "
                    >

                        <label
                            for="password"
                            style="margin-bottom:0;"
                        >
                            Contraseña
                        </label>

                    </div>


                    <div
                        class="password-wrapper"
                        style="position:relative;"
                    >

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Ingresa tu contraseña"
                            required
                            aria-required="true"
                            style="padding-right:50px;"
                        >


                        <!--
                            Este botón será utilizado por JavaScript
                            para mostrar u ocultar la contraseña.
                        -->

                        <button
                            type="button"
                            id="togglePassword"
                            aria-label="Mostrar contraseña"
                            title="Mostrar contraseña"
                            style="
                                position:absolute;
                                right:10px;
                                top:50%;
                                transform:translateY(-50%);
                                width:38px;
                                height:38px;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                border:none;
                                background:transparent;
                                color:#94a3b8;
                                border-radius:8px;
                                cursor:pointer;
                            "
                        >

                            <svg
                                id="eyeIcon"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- ====================================================
                     OPCIONES
                     ==================================================== -->

                <div
                    class="login-options"
                    style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:12px;
                        margin:-4px 0 18px;
                        font-size:13px;
                    "
                >

                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            color:#94a3b8;
                            cursor:pointer;
                        "
                    >

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                            style="accent-color:#3b82f6;"
                        >

                        Recordarme

                    </label>


                    <a
                        href="recuperar.html"
                        style="
                            color:#60a5fa;
                            text-decoration:none;
                        "
                    >
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>



                <!-- ====================================================
                     BOTÓN LOGIN
                     ==================================================== -->

                <button
                    type="submit"
                    id="loginButton"
                    class="btn-primary"
                >

                    <span id="loginButtonText">
                        INICIAR SESIÓN
                    </span>

                </button>

            </form>



            <!-- ========================================================
                 REGISTRO
                 ======================================================== -->

            <div class="form-footer">

                <p>
                    ¿Aún no tienes una cuenta?
                    <a href="registro.html">
                        Crear cuenta
                    </a>
                </p>

            </div>



            <!-- ========================================================
                 SEGURIDAD
                 ======================================================== -->

            <div
                class="login-security"
                style="
                    margin-top:24px;
                    padding-top:18px;
                    border-top:1px solid rgba(255,255,255,0.08);
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    gap:7px;
                    color:#64748b;
                    font-size:11px;
                "
            >

                <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="11"
                        width="18"
                        height="10"
                        rx="2"
                    ></rect>

                    <path
                        d="M7 11V7a5 5 0 0 1 10 0v4"
                    ></path>

                </svg>

                Acceso protegido

            </div>

        </section>

    </main>



    <!-- ================================================================
         JAVASCRIPT
         ================================================================ -->

    <script src="script.js"></script>

</body>
</html>
