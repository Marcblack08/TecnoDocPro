<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoDoc Pro - Iniciar Sesión</title>
    <!-- Aquí conectaremos nuestro CSS en el siguiente paso -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <div class="glass-card">
            
            <div class="logo-section">
                <!-- Un icono temporal (SVG) de seguridad/tecnología -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <h1>TecnoDoc Pro</h1>
                <p>Gestión técnica inteligente</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="marc@ejemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
            </form>

            <div class="form-footer">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            
        </div>
    </main>

    <!-- Aquí conectaremos nuestra lógica de JavaScript más adelante -->
    <script src="script.js"></script>
</body>
</html>
