<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoDoc Pro - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-principal">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <div class="marca">
                <h2>🏢 <span id="ui-nombre-empresa">Cargando...</span></h2>
                <p class="etiqueta-plan" id="ui-plan-empresa">Plan...</p>
            </div>
            
            <nav class="menu">
                <a href="#" class="activo">📊 Panel de Control</a>
                <a href="#">👥 Clientes</a>
                <a href="#">🧾 Proformas</a>
                <a href="#">📋 Informes Técnicos</a>
                <a href="#">📦 Almacén</a>
            </nav>

            <div class="perfil-usuario">
                <p>👤 <strong id="ui-nombre-usuario">Cargando...</strong></p>
                <p class="rol" id="ui-rol-usuario">Rol...</p>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="contenido">
            <header>
                <h1>Resumen General</h1>
                <button class="btn-nuevo">+ Nuevo Documento</button>
            </header>

            <section class="tarjetas-metricas">
                <div class="tarjeta">
                    <h3>Proformas Disponibles</h3>
                    <p class="numero" id="ui-creditos-proformas">0</p>
                </div>
                <div class="tarjeta">
                    <h3>Informes Disponibles</h3>
                    <p class="numero" id="ui-creditos-informes">0</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
