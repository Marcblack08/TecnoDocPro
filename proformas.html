<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoPro - Nueva Proforma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <!-- BARRA SUPERIOR -->
        <header class="top-bar">
            <div class="brand">
                <a href="dashboard.html" class="btn-back">←</a>
                <span>Nueva Proforma</span>
            </div>
            <div class="user-badge">
                <span class="avatar">M</span>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="dashboard-content">
            
            <!-- DATOS DEL CLIENTE -->
            <section class="section-card">
                <h3>Datos del Cliente</h3>
                <div class="input-group">
                    <label for="clienteSelect">Seleccionar Cliente</label>
                    <select id="clienteSelect" class="form-input">
                        <option value="">-- Selecciona o escribe --</option>
                        <option value="1">Condominio Los Álamos (RUC: 20601234567)</option>
                        <option value="2">Taller Autos Express (RUC: 10456789012)</option>
                    </select>
                </div>
            </section>

            <!-- TABLA DE PRODUCTOS / SERVICIOS -->
            <section class="section-card">
                <div class="section-header">
                    <h3>Productos y Servicios</h3>
                    <button type="button" class="btn-secondary" id="btnAgregarFila">+ Agregar</button>
                </div>

                <div class="table-responsive">
                    <table id="proformaTabla" class="proforma-table">
                        <thead>
                            <tr>
                                <th>Descripción / Modelo</th>
                                <th>Cant.</th>
                                <th>P. Unit (S/)</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <input type="text" class="form-input" value="Cámara IP 4MP DS-2CD2T47G2" placeholder="Producto/Modelo">
                                </td>
                                <td>
                                    <input type="number" class="form-input cant-input" value="4" min="1">
                                </td>
                                <td>
                                    <input type="number" class="form-input precio-input" value="380" min="0" step="0.1">
                                </td>
                                <td class="total-celda">S/ 1520.00</td>
                            </tr>
                            <tr>
                                <td>
                                    <input type="text" class="form-input" value="Disco Duro Purple 4TB WD40PURZ" placeholder="Producto/Modelo">
                                </td>
                                <td>
                                    <input type="number" class="form-input cant-input" value="1" min="1">
                                </td>
                                <td>
                                    <input type="number" class="form-input precio-input" value="520" min="0" step="0.1">
                                </td>
                                <td class="total-celda">S/ 520.00</td>
                            </tr>
                            <tr>
                                <td>
                                    <input type="text" class="form-input" value="Instalación y Configuración" placeholder="Producto/Modelo">
                                </td>
                                <td>
                                    <input type="number" class="form-input cant-input" value="4" min="1">
                                </td>
                                <td>
                                    <input type="number" class="form-input precio-input" value="80" min="0" step="0.1">
                                </td>
                                <td class="total-celda">S/ 320.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- RESUMEN Y TOTALES -->
            <section class="section-card resume-card">
                <div class="resume-line">
                    <span>Subtotal:</span>
                    <strong id="resSubtotal">S/ 2360.00</strong>
                </div>
                <div class="resume-line">
                    <span>IGV (18%):</span>
                    <strong id="resIgv">S/ 424.80</strong>
                </div>
                <div class="resume-line total-line">
                    <span>TOTAL:</span>
                    <strong id="resTotal">S/ 2784.80</strong>
                </div>

                <div class="action-buttons">
                    <button class="btn-primary" onclick="alert('Proforma guardada con éxito')">Guardar y Generar PDF</button>
                </div>
            </section>

        </main>

        <!-- NAVEGACIÓN INFERIOR MÓVIL -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">🏠 <span>Inicio</span></a>
            <a href="proformas.html" class="nav-item active">📄 <span>Proformas</span></a>
            <a href="#" class="nav-item">📝 <span>Informes</span></a>
            <a href="#" class="nav-item">📦 <span>Almacén</span></a>
            <a href="#" class="nav-item">👥 <span>Clientes</span></a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
                                                  </html>
